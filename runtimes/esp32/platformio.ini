; Firmware Chili pour ESP32.
;
; Compiler :   python -m platformio run
; Le binaire produit est embarqué dans chili.exe (commande `chili flash`) :
; les utilisateurs n'ont pas besoin de PlatformIO.

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    symlink://../../vm
build_flags =
    -DCHILI_FW_VERSION=\"0.3.0\"
    -Wall
